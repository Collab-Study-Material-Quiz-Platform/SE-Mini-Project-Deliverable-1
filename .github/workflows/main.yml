name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install, build and test (only if code exists)
        run: |
          if [ -f package.json ]; then
            npm install
            npm run build --if-present
            npm test --if-present
          else
            echo "No package.json yet, skipping build"
          fi
