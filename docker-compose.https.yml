# =============================================================================
# docker-compose.https.yml — local HTTPS setup for CSQ-SR-005
#
# Uses host ports 8080 (HTTP) and 8443 (HTTPS) so no admin rights are needed.
# The nginx.conf redirects HTTP → HTTPS on port 8443 (not 443) for the same
# reason; in production you would use standard ports 80 and 443 instead.
#
# The Node backend is expected to be running on the HOST machine (port 5000).
# host.docker.internal resolves to the host from inside the container on
# Docker Desktop (Mac and Windows). On Linux add:
#   extra_hosts:
#     - "host.docker.internal:host-gateway"
# to the nginx service below.
#
# BEFORE STARTING:
#   1. Build the React app:   cd frontend && npm run build
#   2. Generate a dev cert:   bash deploy/generate-dev-cert.sh
#   3. Start the backend:     cd backend && node server.js
#
# THEN:
#   docker compose -f docker-compose.https.yml up
#
# PRODUCTION CHANGES REQUIRED (search for PRODUCTION-CHANGE):
#   - Use real ports 80/443 instead of 8080/8443.
#   - Replace the self-signed cert with a real one (e.g. Let's Encrypt).
#   - The backend should also be containerised; replace host.docker.internal
#     with its container service name in nginx.conf.
# =============================================================================

services:
  nginx:
    image: nginx:alpine
    ports:
      # PRODUCTION-CHANGE: use 80:80 and 443:8443 in production.
      - "8080:80"
      - "8443:8443"
    volumes:
      # Nginx configuration
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # TLS certificate and key (generated by deploy/generate-dev-cert.sh)
      # PRODUCTION-CHANGE: mount your real certificate here instead.
      - ./deploy/certs:/etc/nginx/certs:ro
      # React static build output
      - ./frontend/dist:/usr/share/nginx/html:ro
    # Allows nginx to reach the Node backend on the host via host.docker.internal.
    # On Linux, uncomment the extra_hosts block below.
    # extra_hosts:
    #   - "host.docker.internal:host-gateway"
    restart: unless-stopped
