# =============================================================================
# Nginx TLS-termination config — CSQ-SR-005 / SAD ADR-009 / DS-Sec-05
#
# Design:
#   - Nginx terminates TLS; Node stays on localhost (never exposed directly).
#   - Only TLS 1.2 and 1.3 are accepted.
#   - Plain HTTP (port 80) is redirected to HTTPS with a permanent 301.
#   - HSTS is sent on every HTTPS response.
#   - /api/ is reverse-proxied to the Node backend on port 5000.
#   - Everything else is served from the React static build.
#
# PRODUCTION CHANGES REQUIRED (search for PRODUCTION-CHANGE):
#   1. Replace the certificate paths with your real cert/key (e.g. Let's Encrypt).
#   2. Replace "localhost" with your real domain name.
#   3. Update the HSTS redirect port if you serve on standard 443.
#   4. Optionally add ssl_stapling and ssl_trusted_certificate.
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;

    # -------------------------------------------------------------------------
    # Redirect all plain HTTP to HTTPS — 301 permanent
    # PRODUCTION-CHANGE: update the redirect port from 8443 to 443 in production.
    # -------------------------------------------------------------------------
    server {
        listen 80;

        # PRODUCTION-CHANGE: replace with your real domain.
        server_name localhost;

        return 301 https://$host:8443$request_uri;
    }

    # -------------------------------------------------------------------------
    # HTTPS server
    # PRODUCTION-CHANGE: update listen port from 8443 to 443 in production.
    # -------------------------------------------------------------------------
    server {
        listen 8443 ssl;

        # PRODUCTION-CHANGE: replace with your real domain.
        server_name localhost;

        # ---------------------------------------------------------------------
        # TLS certificate — SAD DS-Sec-05: TLS 1.2+ only
        # PRODUCTION-CHANGE: replace these paths with your real certificate and
        # private key (e.g. /etc/letsencrypt/live/<domain>/fullchain.pem).
        # ---------------------------------------------------------------------
        ssl_certificate     /etc/nginx/certs/localhost.crt;
        ssl_certificate_key /etc/nginx/certs/localhost.key;

        # Only TLS 1.2 and 1.3 — reject anything older (SSLv3, TLS 1.0, 1.1).
        ssl_protocols TLSv1.2 TLSv1.3;

        # Strong cipher suites; prefer server order.
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;

        # TLS session cache to reduce handshake overhead.
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ---------------------------------------------------------------------
        # HSTS — SAD DS-Sec-05: tell browsers to always use HTTPS for 1 year.
        # PRODUCTION-CHANGE: add preload; once stable, submit to the HSTS
        # preload list at https://hstspreload.org.
        # ---------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Defence-in-depth headers.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        # ---------------------------------------------------------------------
        # Reverse proxy — /api/ → Node backend on localhost:5000
        # Node must listen on 127.0.0.1 only (never exposed to the internet).
        # PRODUCTION-CHANGE: if Node runs in a separate container, replace
        # host.docker.internal with the container service name or its IP.
        # ---------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://host.docker.internal:5000;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ---------------------------------------------------------------------
        # React SPA — serve the built static files; fall back to index.html
        # so client-side hash routing works.
        # PRODUCTION-CHANGE: the /usr/share/nginx/html path is set by the
        # Docker volume mount in docker-compose.https.yml; leave it as-is.
        # ---------------------------------------------------------------------
        location / {
            root  /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
